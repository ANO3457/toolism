# MCP servers in the benchmark corpus. `python bench/collect.py` runs each one with toolslim's
# MCP loader and writes its tools/list result to bench/snapshots/<name>.json.
#
# Chosen to be representative, not flattering (design C14 review): the official reference
# servers are lean TypeScript/zod; the rest are popular servers people actually install.
# `{version}` in `command` is replaced by `version`, so every snapshot is pinned.
# None of them needs credentials to answer tools/list.

[[server]]
name = "server-filesystem"
package = "npm:@modelcontextprotocol/server-filesystem"
version = "1.0.0"
command = "npx -y @modelcontextprotocol/server-filesystem@{version} {tmp}"
notes = "Official reference server (TypeScript, zod)."

[[server]]
name = "server-memory"
package = "npm:@modelcontextprotocol/server-memory"
version = "1.0.0"
command = "npx -y @modelcontextprotocol/server-memory@{version}"
notes = "Official reference server (TypeScript, zod)."

[[server]]
name = "server-everything"
package = "npm:@modelcontextprotocol/server-everything"
version = "1.0.0"
command = "npx -y @modelcontextprotocol/server-everything@{version}"
notes = "Official protocol test server (TypeScript, zod)."

[[server]]
name = "server-sequential-thinking"
package = "npm:@modelcontextprotocol/server-sequential-thinking"
version = "1.0.0"
command = "npx -y @modelcontextprotocol/server-sequential-thinking@{version}"
notes = "Official reference server; one tool with a long description."

[[server]]
name = "server-github"
package = "npm:@modelcontextprotocol/server-github"
version = "2025.4.8"
command = "npx -y @modelcontextprotocol/server-github@{version}"
notes = "Archived reference GitHub server, still widely installed (zod-to-json-schema)."

[[server]]
name = "playwright-mcp"
package = "npm:@playwright/mcp"
version = "0.0.83"
command = "npx -y @playwright/mcp@{version} --headless"
notes = "Microsoft's browser automation server."

[[server]]
name = "context7"
package = "npm:@upstash/context7-mcp"
version = "4.4.2"
command = "npx -y @upstash/context7-mcp@{version}"
notes = "Popular documentation lookup server."

[[server]]
name = "notion"
package = "npm:@notionhq/notion-mcp-server"
version = "2.5.2"
command = "npx -y @notionhq/notion-mcp-server@{version}"
notes = "Official Notion server, generated from an OpenAPI spec."

[[server]]
name = "mcp-server-git"
package = "pypi:mcp-server-git"
version = "2026.10.10"
command = "uvx mcp-server-git=={version} --repository {repo}"
notes = "Official reference server (Python SDK, Pydantic)."

[[server]]
name = "mcp-server-fetch"
package = "pypi:mcp-server-fetch"
version = "2026.10.10"
command = "uvx mcp-server-fetch=={version}"
notes = "Official reference server (Python SDK, Pydantic)."

[[server]]
name = "mcp-server-time"
package = "pypi:mcp-server-time"
version = "2026.10.10"
command = "uvx mcp-server-time=={version}"
notes = "Official reference server (Python SDK, Pydantic)."

[[server]]
name = "aws-documentation"
package = "pypi:awslabs.aws-documentation-mcp-server"
version = "1.2.3"
command = "uvx awslabs.aws-documentation-mcp-server=={version}"
notes = "AWS Labs server built on FastMCP with Pydantic Field descriptions."

[[server]]
name = "arxiv"
package = "pypi:arxiv-mcp-server"
version = "0.8.2"
command = "uvx --python 3.12 arxiv-mcp-server=={version}"
notes = "Popular community server (Python)."
